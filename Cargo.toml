[workspace]
resolver = "2"
members = ["crates/sunset-core", "crates/sunset"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Keep dev builds light on memory: no debug info, no optimization. This makes
# large dependencies (Bevy) compilable on modest-RAM machines.
[profile.dev]
debug = false
opt-level = 0
