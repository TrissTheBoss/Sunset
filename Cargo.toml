[workspace]
members = ["xtask", "crates/sunset-metrics", "crates/sunset-core", "crates/sunset-render", "crates/sunset-client", "crates/sunset-jobs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = "line-tables-only"
