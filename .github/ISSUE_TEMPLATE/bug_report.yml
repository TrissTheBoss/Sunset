name: Bug report
description: Report a reproducible issue in implemented project code
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Sunset is currently a non-playable framework scaffold. Please report only behavior that exists in this repository."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands, inputs, and observed output.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision or release
      description: Commit hash or release tag.
    validations:
      required: true
